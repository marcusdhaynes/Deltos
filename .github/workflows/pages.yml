name: Publish Deltos web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          DELTOS_AUTH_BACKEND_URL: ${{ vars.DELTOS_AUTH_BACKEND_URL }}
      - name: Verify deployed Gmail authentication when configured
        run: node auth-server/verify-deployment.mjs
        env:
          DELTOS_AUTH_BACKEND_URL: ${{ vars.DELTOS_AUTH_BACKEND_URL }}
      - name: Install Chromium for release gate
        run: npx playwright install --with-deps chromium
      - name: Gate release on browser regressions
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
